services:
  dispatcher:
    build:
      context: ./app/dispatcher
    ports:
      - "18861:18861"

  worker:
    build:
      context: ./app/worker
    depends_on:
      - dispatcher
      - redis
    environment:
      DISPATCHER_HOST: dispatcher
      DISPATCHER_PORT: 18861
      REDIS_HOST: redis
      REDIS_PORT: 6379

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
